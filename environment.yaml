name: pml
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.7
  - pip
  - numpy
  - pandas
  - scikit-learn
  - scipy
  - matplotlib
  - seaborn
  - jupyter
  - notebook
  - ipython
  - cudatoolkit=11.3
  - pip:
      # Deep Learning Frameworks
      - torch>=1.13
      - torchaudio
      - pytorch-lightning
      - keras
      
      # Transformers & NLP
      - transformers
      - tokenizers
      - datasets
      - huggingface-hub
      
      # ML Utilities
      - wandb
      - timm
      - safetensors
      
      # Data Processing
      - tqdm
      - pyarrow
      
      # Visualization
      - wordcloud
      
      # Other Dependencies
      - pygame
      - shapely
